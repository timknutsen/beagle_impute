# ============================================================
# Imputation accuracy evaluation configuration
# ============================================================
# Run with: snakemake --snakefile Snakefile_accuracy [options]
#
# Both modes are animal-level K-fold cross-validation. Each fold's held-out
# animals are imputed from a low-density (LD) marker panel, with the other
# folds as the high-density reference, and scored against their real
# high-density genotypes on the markers they were NOT given.
#
#   kfold_mask_and_impute — one bfile. The LD panel is sampled from it
#                           (cv.target_n_snps) or given (cv.target_snp_list).
#
#   cross_array           — the same animals on two real arrays (LD and HD).
#                           The LD panel is exactly the markers both carry, and
#                           an identity gate drops mismatched pairs first.

# ── Mode ─────────────────────────────────────────────────────────────────────
accuracy_mode: "kfold_mask_and_impute"

accuracy_output_dir: "accuracy_output"

# ── cross_array settings ─────────────────────────────────────────────────────
# Runs the acc_cv_* rule family, so cv: below applies here too (n_folds, seed,
# imputers, reference_max_animals). The LD panel is not sampled in this mode --
# it is exactly the markers both arrays carry.
cross_array:
  ld_bfile: ""                 # PLINK prefix of low-density array (imputation input)
                               # e.g. "data/animals_50k"
  hd_bfile: ""                 # PLINK prefix of high-density array (truth)
                               # e.g. "data/animals_70kv4"

  # Identity gate. Pairing an animal's two typings on its ID assumes both came
  # from one fish; when an ID covers two physical samples the pair is two
  # unrelated salmon and the run scores an imputation that never had a chance.
  # Concordance between the arrays at their shared markers separates the cases
  # cleanly -- the same animal lands at 0.95-1.0, two different fish near 0.5,
  # nothing in between -- so any threshold in the gap works. On the 2026-08
  # benchmark this caught 974 of 3,881 animals (25%) in one step.
  identity_threshold: 0.90
  # Abort rather than report a number when this share of the cohort fails.
  min_identity_pass_rate: 0.5

  # Abort if the two arrays share fewer markers than this. Too few and the
  # identity check has nothing to judge on and the LD panel is not an array.
  min_shared_markers: 100

# ── CV settings (both modes) ────────────────────────────────────────────────
cv:
  n_folds: 10
  # Run only these folds; empty runs all. [1] is a single hold-out of
  # 1/n_folds of the animals -- a quick check before the full K-fold.
  folds_to_run: []
  target_n_snps: 10000
  # Optional fixed SNP list; leave empty to sample from .bim. Set this to the
  # markers shared with the low-density array (scripts/shared_marker_list.py)
  # to mask a high-density cohort down to a real array rather than a random
  # thinning -- e.g. V4 fish downsampled to the 50K markers.
  # Ignored in cross_array, which derives the panel from the two .bim files.
  target_snp_list: ""
  random_seed: 42
  # AlphaImpute2 is also supported, but costs ~12 h per step against
  # FImpute's minutes; add it only when you need the comparison.
  imputers: ["beagle", "fimpute"]

  # Cap the reference panel at N animals per fold, sampled at random_seed.
  # 0 keeps every non-held-out animal. Re-running with different values (and a
  # different accuracy_output_dir) is how the accuracy-vs-panel-size curve is
  # measured; past the plateau the extra animals are only costing compute.
  reference_max_animals: 0

  # A marker reaches reliable_markers.txt when its *worst* fold clears this,
  # not its mean. A marker that collapses in one fold out of five has no place
  # in a reference panel, and averaging hides exactly that.
  reliable_r2_threshold: 0.90

# ── Accuracy metric settings ─────────────────────────────────────────────────
# MAF bin boundaries for stratified accuracy reporting.
# Each bin is [left, right); the last bin closes at 0.5.
# Default gives bins: 0-1%, 1-5%, 5-10%, 10-20%, 20-50%
maf_bins: [0.01, 0.05, 0.1, 0.2, 0.5]
